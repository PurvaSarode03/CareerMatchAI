{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4">
  <h4>Your profile</h4><p class="text-muted">{{ user.email }}</p>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-brand">Save</button>
  </form>
</div></div></div>
{% endblock %}
