{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4">
  <h3 class="mb-1">Create your account</h3><p class="text-muted">Upload a resume and see how you match.</p>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-brand w-100">Sign up</button>
  </form>
  <p class="mt-3 mb-0 text-center">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div></div></div>
{% endblock %}
